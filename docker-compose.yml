services:
  postgres:
    image: postgres:17-alpine
    container_name: entrolix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: entrolix
      POSTGRES_USER: entrolix_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entrolix_local_password}
    ports:
      - "5432:5432"
    volumes:
      - entrolix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrolix_user -d entrolix"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-replace-this-before-public-deployment}
      DATABASE_URL: postgresql://entrolix_user:${POSTGRES_PASSWORD:-entrolix_local_password}@postgres:5432/entrolix
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  entrolix_postgres_data:
