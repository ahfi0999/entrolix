server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache" always; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    # Vite fingerprints these files: a new release gets a new URL.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Public images keep stable filenames and must be revalidated.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }
}
